name: Run Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # restart otomatis tiap 6 jam (batas job GitHub = 6 jam)

# Cuma 1 instance boleh jalan; yang baru menggantikan yang lama
concurrency:
  group: music-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Node dipakai yt-dlp untuk memecahkan tantangan JS YouTube
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Opsional: kalau secret COOKIES_TXT diisi, dipakai menggantikan cookies.txt di repo
      - name: Tulis cookies dari secret
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "$COOKIES_TXT" ]; then printf '%s\n' "$COOKIES_TXT" > cookies.txt; fi

      - name: Run Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          LK21_API_BASE: ${{ secrets.LK21_API_BASE }}
        run: python -u bot.py
